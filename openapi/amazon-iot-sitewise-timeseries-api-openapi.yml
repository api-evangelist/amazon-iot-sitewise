  /timeseries/:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListTimeSeries
      description: Retrieves a paginated list of time series (data streams).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTimeSeriesResponse'
        '480':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '482':
          description: InternalFailureException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFailureException'
        '483':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
      parameters:
      - name: nextToken
        in: query
        required: false
        description: The token to be used for the next set of paginated results.
        schema:
          type: string
          pattern: '[A-Za-z0-9+/=]+'
          minLength: 1
          maxLength: 4096
      - name: maxResults
        in: query
        required: false
        description: The maximum number of results to return for each paginated request.
        schema:
          type: integer
          minimum: 1
          maximum: 250
      - name: assetId
        in: query
        required: false
        description: The ID of the asset in which the asset property was created.
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          minLength: 36
          maxLength: 36
      - name: aliasPrefix
        in: query
        required: false
        description: The alias prefix of the time series.
        schema:
          type: string
          pattern: '[^\u0000-\u001F\u007F]+'
          minLength: 1
      - name: timeSeriesType
        in: query
        required: false
        description: <p>The type of the time series. The time series type can be one of the following values:</p> <ul> <li> <p> <code>ASSOCIATED</code> – The time series is associated with an asset property.</p> </li> <li> <p> <code>DISASSOCIATED</code> – The time series isn't associated with any asset property.</p> </li> </ul>
        schema:
          type: string
          enum:
          - ASSOCIATED
          - DISASSOCIATED
      summary: Amazon IoT SiteWise List Time Series
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Timeseries
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
  schemas:
    InternalFailureException: {}
    Timestamp:
      type: string
      format: date-time
    DescribeTimeSeriesResponse:
      type: object
      required:
      - timeSeriesId
      - dataType
      - timeSeriesCreationDate
      - timeSeriesLastUpdateDate
      - timeSeriesArn
      properties:
        assetId:
          allOf:
          - $ref: '#/components/schemas/ID'
          - description: The ID of the asset in which the asset property was created.
        propertyId:
          allOf:
          - $ref: '#/components/schemas/ID'
          - description: The ID of the asset property.
        alias:
          allOf:
          - $ref: '#/components/schemas/PropertyAlias'
          - description: The alias that identifies the time series.
        timeSeriesId:
          allOf:
          - $ref: '#/components/schemas/TimeSeriesId'
          - description: The ID of the time series.
        dataType:
          allOf:
          - $ref: '#/components/schemas/PropertyDataType'
          - description: <p>The data type of the time series.</p> <p>If you specify <code>STRUCT</code>, you must also specify <code>dataTypeSpec</code> to identify the type of the structure for this time series.</p>
        dataTypeSpec:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: <p>The data type of the structure for this time series. This parameter is required for time series that have the <code>STRUCT</code> data type.</p> <p>The options for this parameter depend on the type of the composite model in which you created the asset property that is associated with your time series. Use <code>AWS/ALARM_STATE</code> for alarm state in alarm composite models.</p>
        timeSeriesCreationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date that the time series was created, in Unix epoch time.
        timeSeriesLastUpdateDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date that the time series was last updated, in Unix epoch time.
        timeSeriesArn:
          allOf:
          - $ref: '#/components/schemas/ARN'
          - description: <p>The <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">ARN</a> of the time series, which has the following format.</p> <p> <code>arn:${Partition}:iotsitewise:${Region}:${Account}:time-series/${TimeSeriesId}</code> </p>
    TimeSeriesSummary:
      type: object
      required:
      - timeSeriesId
      - dataType
      - timeSeriesCreationDate
      - timeSeriesLastUpdateDate
      - timeSeriesArn
      properties:
        assetId:
          allOf:
          - $ref: '#/components/schemas/ID'
          - description: The ID of the asset in which the asset property was created.
        propertyId:
          allOf:
          - $ref: '#/components/schemas/ID'
          - description: The ID of the asset property.
        alias:
          allOf:
          - $ref: '#/components/schemas/PropertyAlias'
          - description: The alias that identifies the time series.
        timeSeriesId:
          allOf:
          - $ref: '#/components/schemas/TimeSeriesId'
          - description: The ID of the time series.
        dataType:
          allOf:
          - $ref: '#/components/schemas/PropertyDataType'
          - description: <p>The data type of the time series.</p> <p>If you specify <code>STRUCT</code>, you must also specify <code>dataTypeSpec</code> to identify the type of the structure for this time series.</p>
        dataTypeSpec:
          allOf:
          - $ref: '#/components/schemas/Name'
          - description: <p>The data type of the structure for this time series. This parameter is required for time series that have the <code>STRUCT</code> data type.</p> <p>The options for this parameter depend on the type of the composite model in which you created the asset property that is associated with your time series. Use <code>AWS/ALARM_STATE</code> for alarm state in alarm composite models.</p>
        timeSeriesCreationDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date that the time series was created, in Unix epoch time.
        timeSeriesLastUpdateDate:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date that the time series was last updated, in Unix epoch time.
        timeSeriesArn:
          allOf:
          - $ref: '#/components/schemas/ARN'
          - description: <p>The <a href="https://docs.aws.amazon.com/general/latest/gr/aws-arns-and-namespaces.html">ARN</a> of the time series, which has the following format.</p> <p> <code>arn:${Partition}:iotsitewise:${Region}:${Account}:time-series/${TimeSeriesId}</code> </p>
      description: Contains a summary of a time series (data stream).
    PropertyDataType:
      type: string
      enum:
      - STRING
      - INTEGER
      - DOUBLE
      - BOOLEAN
      - STRUCT
    InvalidRequestException: {}
    ConflictingOperationException: {}
    PropertyAlias:
      type: string
